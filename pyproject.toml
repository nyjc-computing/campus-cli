[tool.poetry]
name = "campus-cli"
version = "0.10.7"
description = "Campus CLI - Command-line interface for Campus API"
authors = ["NYJC Computing <nyjc.computing@nyjc.edu.sg>"]
readme = "README.md"

[tool.poetry.dependencies]
# Python support tiers (python.org release status):
# - security (3.11-3.13): officially supported; CI-required.
# - bugfix (3.14): unofficial ("not yet but eventually"); CI-tested with
#   failures allowed; never deployed to prod.
python = ">=3.11,<3.15"
typer = "^0.25.1"
rich = "^13.9.0"
keyring = "^25.6.0"
campus-api-python = {url = "https://github.com/nyjc-computing/campus-api-python/releases/download/v0.11.0/campus_api_python-0.11.0-py3-none-any.whl"}
pyperclip = "^1.11.0"

[tool.poetry.scripts]
campus = "campus_cli.cli:app"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.9.0"

[tool.poetry.group.docs.dependencies]
# Same docs stack as campus-api-python (mkdocs-material). The command
# reference is NOT hand-written: it is generated from the Typer app by
# scripts/generate_cli_reference.py (committed + CI drift gate) — the
# committed-openapi + drift-test pattern the suite uses for its HTTP
# specs, applied to CLI help.
mkdocs-material = "^9.8.0"

[[tool.poetry.packages]]
include = "campus_cli"

[tool.pyright]
useLibraryCodeForTypes = true
exclude = [
    ".cache",
    "**/.*",
    "**/__pycache__",
    "**/node_modules",
    "**/.venv",
    "**/venv",
]

[tool.ruff]
# target-version keeps stdlib classification correct (tomllib is
# stdlib on 3.11+; without it ruff defaults to py39 and wants a
# separate import block for it).
target-version = "py311"

[tool.ruff.lint]
select = ['E', 'W', 'F', 'I', 'B', 'C4', 'ARG', 'SIM']
ignore = ['W291', 'W292', 'W293']

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
