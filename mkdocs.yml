site_name: Campus CLI
site_description: >-
  Command-line interface for the Campus school platform — device-flow
  login, OAuth client/user/grant/vault administration, audit traces,
  and the campus.api resources (assignments, submissions, timetables,
  circles, files, hosted apps, venues).
repo_url: https://github.com/nyjc-computing/campus-cli
repo_name: nyjc-computing/campus-cli

strict: true

# Internal dev docs live in docs/ too — they are repo notes, not user
# docs, and they link to files outside the docs tree.
exclude_docs: |
  development.md
  PRD.md
  plan.md

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      # Version stamp (docs/snippets/version.md) is generated from
      # pyproject.toml by scripts/sync_docs_version.py — CI regenerates
      # and fails on drift, so the landing page can't go stale.
      base_path: ["docs"]
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Authentication & scopes: authentication.md
  - Reference:
      - Commands: reference/commands.md
